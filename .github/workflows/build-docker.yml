name: Build & Push Docker to RunPod

on:
  push:
    branches: [main]
    paths:
      - 'docker/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login to RunPod Registry
        uses: docker/login-action@v3
        with:
          registry: registry.runpod.net
          username: ${{ secrets.RUNPOD_REGISTRY_USER }}
          password: ${{ secrets.RUNPOD_REGISTRY_PASS }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile
          push: true
          tags: |
            registry.runpod.net/juliocrn94-splatter-main-docker-dockerfile:${{ github.sha }}
            registry.runpod.net/juliocrn94-splatter-main-docker-dockerfile:latest
